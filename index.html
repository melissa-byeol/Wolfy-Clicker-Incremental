<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfy Clicker v4.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-shell">
        
        <!-- HEADER SUPERIOR -->
        <header class="top-bar">
            <div class="brand">🐺 Wolfy Inc.</div>
            <div class="stats-center">
                <h1 id="wc-display">0 WC</h1>
                <p id="wcs-display">+0.0/s</p>
            </div>
            <button id="btn-terminal" class="icon-btn">💻</button>
        </header>

        <!-- CUERPO PRINCIPAL (GRID) -->
        <main class="content-grid">
            
            <!-- IZQUIERDA: TIENDA SIMPLE -->
            <aside class="panel shop-panel">
                <h2>Tienda Lupina</h2>
                
                <!-- Mejoras de Clic -->
                <div class="shop-section">
                    <h3>Clic Power</h3>
                    <div id="list-click-upgrades"></div>
                </div>

                <!-- Edificios -->
                <div class="shop-section">
                    <h3>Producción</h3>
                    <div id="list-buildings"></div>
                </div>
            </aside>

            <!-- CENTRO: EL CLICKER -->
            <section class="panel center-stage">
                <div class="clicker-wrapper">
                    <img src="assets/coin.png" alt="Wolficha" id="main-coin" class="big-coin">
                    <div id="float-layer"></div> <!-- Para números flotantes -->
                </div>
                <p class="hint-text">Haz clic para ganar Wolfichas</p>
            </section>

            <!-- DERECHA: JUEGOS & CHAT -->
            <aside class="panel side-panel">
                <nav class="side-tabs">
                    <button class="tab-active" data-view="view-chat">💬 Chat</button>
                    <button data-view="view-rhythm">🎤 Ritmo</button>
                </nav>

                <!-- Vista Chat -->
                <div id="view-chat" class="side-content active">
                    <div id="chat-box" class="chat-container"></div>
                    <small>Streamer Wolfy está en vivo...</small>
                </div>

                <!-- Vista Ritmo -->
                <div id="view-rhythm" class="side-content hidden">
                    <h3>Idol Stage</h3>
                    <select id="song-select">
                        <option value="swim">Swim (Demo)</option>
                    </select>
                    
                    <div class="rhythm-area">
                        <div class="lanes">
                            <div class="lane" data-key="a"><span>A</span></div>
                            <div class="lane" data-key="s"><span>S</span></div>
                            <div class="lane" data-key="d"><span>D</span></div>
                            <div class="lane" data-key="f"><span>F</span></div>
                        </div>
                        <div class="hit-zone"></div>
                        <canvas id="rhythm-canvas" width="300" height="200"></canvas>
                    </div>
                    
                    <div class="rhythm-controls">
                        <button id="btn-play-song">▶ Play</button>
                        <button id="btn-stop-song">■ Stop</button>
                    </div>
                    <p id="score-display">Score: 0</p>
                </div>
            </aside>

        </main>
    </div>

    <!-- MODAL TERMINAL (SECRETO) -->
    <div id="modal-term" class="modal-overlay hidden">
        <div class="term-window">
            <div class="term-header">WOLFY OS <button id="btn-close-term">✖</button></div>
            <div id="term-log" class="term-body"></div>
            <div class="term-input-group">
                <span>$</span>
                <input type="text" id="term-input" placeholder="comando...">
            </div>
        </div>
    </div>

</body>
</html>
